[package]
name = "vfbow"
version = "0.1.2"
edition = "2024"

[lib]
name = "vfbow"
path = "src/lib.rs"
# crate-type = ["cdylib"]


[dependencies]
arrayvec = "0.7.6"
# datasize = { version = "0.2.15", features = ["detailed"] }
ndarray = "0.16.1"
num-traits = "0.2.19"
numpy = { version = "0.23.0", optional = true }
opencv = { version = "0.94.2", optional = true }
pyo3 = { version = "0.23.4", features = ["experimental-inspect", "either"], optional = true }
rand = "0.9.0"
rayon = "1.10.0"
thiserror = "2.0.11"

[dev-dependencies]
clap = { version = "4.5.28", features = ["cargo", "derive"] }
criterion = "0.5.1"

[[bench]]
name = "bench_create"
path = "benches/bench_create.rs"
harness = false

[[bench]]
name = "bench_read"
path = "benches/bench_read.rs"
harness = false

[features]
python = [
    "dep:pyo3",
    # "dep:pyo3-file",
    "dep:numpy",
]
default = ["python"]
opencv = ["dep:opencv"]
