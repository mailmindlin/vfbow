[package]
name = "fbow-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]


[dependencies]
arrayvec = "0.7.6"
clap = { version = "4.5.20", features = ["cargo", "derive"] }
ndarray = "0.16.1"
numpy = { version = "0.22.0", optional = true }
opencv = { version = "0.93.3", optional = true }
pyo3 = { version = "0.22.5", features = ["experimental-inspect"], optional = true }
pyo3-file = { version = "0.9.0", optional = true }
rand = "0.8.5"
rayon = "1.10.0"
thiserror = "1.0.64"

[features]
python = [
    "dep:pyo3",
    "dep:pyo3-file",
    "dep:numpy",
]
default = ["python"]
opencv = ["dep:opencv"]
