[package]
name = "vfbow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]


[dependencies]
aligned_box = "0.3.0"
arrayvec = "0.7.6"
backtrace = "0.3.74"
# datasize = { version = "0.2.15", features = ["detailed"] }
ndarray = "0.16.1"
num-traits = "0.2.19"
numpy = { version = "0.23.0", optional = true }
opencv = { version = "0.94.2", optional = true }
pyo3 = { version = "0.23.4", features = ["experimental-inspect", "either"], optional = true }
rand = "0.9.0"
rayon = "1.10.0"
thiserror = "2.0.11"

[dev-dependencies]
clap = { version = "4.5.20", features = ["cargo", "derive"] }

[features]
python = [
    "dep:pyo3",
    # "dep:pyo3-file",
    "dep:numpy",
]
default = []
opencv = ["dep:opencv"]
