[package]
name = "vfbow"
version = "0.1.2"
edition = "2024"

[lib]
name = "vfbow"
path = "src/lib.rs"
# crate-type = ["cdylib"]


[dependencies]
arrayvec = "0.7.6"

num-traits = "0.2.19"
opencv = { version = "0.97.2", optional = true }
rand = "0.9.2"
rayon = "1.11.0"
thiserror = "2.0.17"
# These three libraries' versions have to be kept in sync
ndarray = "0.16.1"
numpy = { version = "0.27.0", optional = true }
pyo3 = { version = "0.27.1", features = ["experimental-inspect", "either"], optional = true }

[dev-dependencies]
clap = { version = "4.5.53", features = ["cargo", "derive"] }
criterion = "0.7.0"

[[bench]]
name = "bench_create"
path = "benches/bench_create.rs"
harness = false

[[bench]]
name = "bench_read"
path = "benches/bench_read.rs"
harness = false

[features]
python = [
    "dep:pyo3",
    "dep:numpy",
]
default = ["python"]
opencv = ["dep:opencv"]
